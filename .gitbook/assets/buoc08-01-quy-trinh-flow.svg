<svg viewBox="0 0 600 868" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
    .card { fill: #F4F7FC; stroke: #E1E8F5; stroke-width: 1; }
    .accent { fill: #0F3573; }
    .accent-light { fill: #3B78E0; }
    .title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0F3573; }
    .desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #4A5568; }
    .arrow { stroke: #90A4C8; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #90A4C8; }
    .badge { fill: #FFFFFF; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .end-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F3573; }
    .end-desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
    .danger-box { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1; }
    .danger-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #991B1B; }
    .warn-box { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1; }
    .warn-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #92400E; }
</style>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowhead"/>
    </marker>
    
  </defs>
  <g transform="translate(90,15)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">1. Kiểm tra số lượng bài thi</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Đếm và ghi chú số lượng thực tế theo từng phòng, từng</text>
    <text class="desc" x="210" y="66" text-anchor="middle">buổi.</text>
  </g>
  <path class="arrow" d="M300,91 L300,111" marker-end="url(#arrowV)"/>
  <g transform="translate(90,111)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">2. Đối soát tờ bìa xanh &amp; hộ chiếu photo</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Khớp họ tên, ngày sinh, chữ ký, nơi sinh; xử lý hộ chiếu</text>
    <text class="desc" x="210" y="66" text-anchor="middle">photo đúng quy định.</text>
  </g>
  <path class="arrow" d="M300,187 L300,207" marker-end="url(#arrowV)"/>
  <g transform="translate(90,207)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">3. Kiểm tra khu vực 4 kỹ năng</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Mã đề, mộc &amp; ngày thi, mộc + chữ ký giám khảo Nói, điểm</text>
    <text class="desc" x="210" y="66" text-anchor="middle">thi Nói.</text>
  </g>
  <path class="arrow" d="M300,283 L300,303" marker-end="url(#arrowV)"/>
  <g transform="translate(90,303)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">4. Đối soát tờ đáp án mỗi kỹ năng</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Khớp họ tên, ngày sinh, địa điểm thi trên từng tờ đáp</text>
    <text class="desc" x="210" y="66" text-anchor="middle">án.</text>
  </g>
  <path class="arrow" d="M300,379 L300,399" marker-end="url(#arrowV)"/>
  <g transform="translate(90,399)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">5. Kiểm tra tờ Đề &amp; giấy nháp</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Ghi mã đề lên bìa xanh; loại giấy nháp không có tên thí</text>
    <text class="desc" x="210" y="66" text-anchor="middle">sinh.</text>
  </g>
  <path class="arrow" d="M300,475 L300,495" marker-end="url(#arrowV)"/>
  <g transform="translate(90,495)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">6. Đóng mộc bổ sung</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Bổ sung mộc PNE và mộc ngày còn thiếu trên các tờ liên</text>
    <text class="desc" x="210" y="66" text-anchor="middle">quan.</text>
  </g>
  <path class="arrow" d="M300,571 L300,591" marker-end="url(#arrowV)"/>
  <g transform="translate(90,591)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">7. Sắp xếp bài thi theo đúng thứ tự</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Bìa xanh → hộ chiếu → Nói → Đọc → Nghe → Viết → giấy</text>
    <text class="desc" x="210" y="66" text-anchor="middle">nháp.</text>
  </g>
  <path class="arrow" d="M300,667 L300,687" marker-end="url(#arrowV)"/>
  <g transform="translate(90,687)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">8. Kiểm tra lịch thi tiếp theo</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Tách hồ sơ theo còn lịch thi Nói / thi NDV hay đã hoàn</text>
    <text class="desc" x="210" y="66" text-anchor="middle">tất toàn bộ.</text>
  </g>
  <g transform="translate(90,783)">
    <rect class="card" x="0" y="0" width="420" height="70" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="34" text-anchor="middle" font-size="15">✅ Sẵn sàng chuyển</text>
    <text class="desc" x="210" y="54" text-anchor="middle">sang 08-04 — Hoàn tất hồ sơ thi</text>
  </g>
</svg>