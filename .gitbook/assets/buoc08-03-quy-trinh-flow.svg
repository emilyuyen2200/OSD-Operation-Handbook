<svg viewBox="0 0 600 580" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
    .card { fill: #F4F7FC; stroke: #E1E8F5; stroke-width: 1; }
    .accent { fill: #0F3573; }
    .accent-light { fill: #3B78E0; }
    .title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0F3573; }
    .desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #4A5568; }
    .arrow { stroke: #90A4C8; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #90A4C8; }
    .badge { fill: #FFFFFF; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .end-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F3573; }
    .end-desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
    .danger-box { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1; }
    .danger-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #991B1B; }
    .warn-box { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1; }
    .warn-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #92400E; }
</style>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowhead"/>
    </marker>
    
  </defs>
  <g transform="translate(90,15)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">1. Chuẩn bị hồ sơ</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Tách riêng hồ sơ đăng ký nhận kết quả nhanh, sắp xếp và</text>
    <text class="desc" x="210" y="66" text-anchor="middle">đóng đủ mộc.</text>
  </g>
  <path class="arrow" d="M300,91 L300,111" marker-end="url(#arrowV)"/>
  <g transform="translate(90,111)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">2. Scan bài thi</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Full Color · 600dpi · Density 4; scan toàn bộ trang, lưu</text>
    <text class="desc" x="210" y="66" text-anchor="middle">trực tiếp vào USB.</text>
  </g>
  <path class="arrow" d="M300,187 L300,207" marker-end="url(#arrowV)"/>
  <g transform="translate(90,207)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">3. Kiểm tra file scan</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Đủ trang, đúng thứ tự, đúng tên file; lưu vào thư mục</text>
    <text class="desc" x="210" y="66" text-anchor="middle">Express.</text>
  </g>
  <path class="arrow" d="M300,283 L300,303" marker-end="url(#arrowV)"/>
  <g transform="translate(90,303)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">4. Cập nhật danh sách</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Đối chiếu danh sách đăng ký với hồ sơ thực tế; in màu để</text>
    <text class="desc" x="210" y="66" text-anchor="middle">cập nhật hệ thống.</text>
  </g>
  <path class="arrow" d="M300,379 L300,399" marker-end="url(#arrowV)"/>
  <g transform="translate(90,399)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">5. Bàn giao và lưu hồ sơ</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Bàn giao USB để cập nhật lên hệ thống; lưu hồ sơ chờ xử</text>
    <text class="desc" x="210" y="66" text-anchor="middle">lý cùng ngày cuối.</text>
  </g>
  <g transform="translate(90,495)">
    <rect class="card" x="0" y="0" width="420" height="70" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="34" text-anchor="middle" font-size="15">✅ Sẵn sàng</text>
    <text class="desc" x="210" y="54" text-anchor="middle">chờ xử lý cùng toàn bộ bài thi ngày cuối</text>
  </g>
</svg>