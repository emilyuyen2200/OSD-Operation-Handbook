<svg viewBox="0 0 620 265" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
    .card { fill: #F4F7FC; stroke: #E1E8F5; stroke-width: 1; }
    .accent { fill: #0F3573; }
    .accent-light { fill: #3B78E0; }
    .title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0F3573; }
    .desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #4A5568; }
    .arrow { stroke: #90A4C8; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #90A4C8; }
    .badge { fill: #FFFFFF; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .end-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F3573; }
    .end-desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
    .danger-box { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1; }
    .danger-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #991B1B; }
    .warn-box { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1; }
    .warn-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #92400E; }
</style>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowhead"/>
    </marker>
    
  </defs>
  <line x1="60" y1="60" x2="560" y2="60" stroke="#C9D6EA" stroke-width="3"/>
  <circle cx="60.0" cy="60" r="12" fill="#0F3573"/>
  <text x="60.0" y="65" text-anchor="middle" class="badge" font-size="12">1</text>
  <g transform="translate(-5.0,95)">
    <rect class="card" x="0" y="0" width="130" height="150" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="130" height="5" rx="2"/>
    <text class="title" x="65.0" y="26" text-anchor="middle" font-size="14">Trước 5 ngày</text>
    <text class="desc" x="65.0" y="46" text-anchor="middle" font-size="11.5">Chuẩn bị thiết bị,</text>
    <text class="desc" x="65.0" y="61" text-anchor="middle" font-size="11.5">in ấn hồ sơ &amp; biểu</text>
    <text class="desc" x="65.0" y="76" text-anchor="middle" font-size="11.5">mẫu, văn phòng</text>
    <text class="desc" x="65.0" y="91" text-anchor="middle" font-size="11.5">phẩm.</text>
  </g>
  <circle cx="226.66666666666666" cy="60" r="12" fill="#0F3573"/>
  <text x="226.66666666666666" y="65" text-anchor="middle" class="badge" font-size="12">2</text>
  <g transform="translate(161.66666666666666,95)">
    <rect class="card" x="0" y="0" width="130" height="150" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="130" height="5" rx="2"/>
    <text class="title" x="65.0" y="26" text-anchor="middle" font-size="14">Trước 1 ngày</text>
    <text class="desc" x="65.0" y="46" text-anchor="middle" font-size="11.5">Setup phòng thi</text>
    <text class="desc" x="65.0" y="61" text-anchor="middle" font-size="11.5">theo layout chuẩn,</text>
    <text class="desc" x="65.0" y="76" text-anchor="middle" font-size="11.5">lắp đặt thiết bị,</text>
    <text class="desc" x="65.0" y="91" text-anchor="middle" font-size="11.5">kiểm tra lần cuối.</text>
  </g>
  <circle cx="393.3333333333333" cy="60" r="12" fill="#0F3573"/>
  <text x="393.3333333333333" y="65" text-anchor="middle" class="badge" font-size="12">3</text>
  <g transform="translate(328.3333333333333,95)">
    <rect class="card" x="0" y="0" width="130" height="150" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="130" height="5" rx="2"/>
    <text class="title" x="65.0" y="26" text-anchor="middle" font-size="14">Trong kỳ thi</text>
    <text class="desc" x="65.0" y="46" text-anchor="middle" font-size="11.5">Xử lý sự cố thiết</text>
    <text class="desc" x="65.0" y="61" text-anchor="middle" font-size="11.5">bị, bổ sung vật</text>
    <text class="desc" x="65.0" y="76" text-anchor="middle" font-size="11.5">dụng khi cần.</text>
  </g>
  <circle cx="560.0" cy="60" r="12" fill="#0F3573"/>
  <text x="560.0" y="65" text-anchor="middle" class="badge" font-size="12">4</text>
  <g transform="translate(495.0,95)">
    <rect class="card" x="0" y="0" width="130" height="150" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="130" height="5" rx="2"/>
    <text class="title" x="65.0" y="26" text-anchor="middle" font-size="14">Sau kỳ thi</text>
    <text class="desc" x="65.0" y="46" text-anchor="middle" font-size="11.5">Thu hồi thiết bị &amp;</text>
    <text class="desc" x="65.0" y="61" text-anchor="middle" font-size="11.5">vật dụng, kiểm kê,</text>
    <text class="desc" x="65.0" y="76" text-anchor="middle" font-size="11.5">bàn giao hồ sơ.</text>
  </g>
</svg>