<svg viewBox="0 0 620 528" width="100%" height="auto" style="display:block;max-width:100%;" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
    .card { fill: #F4F7FC; stroke: #E1E8F5; stroke-width: 1; }
    .accent { fill: #0F3573; }
    .accent-light { fill: #3B78E0; }
    .title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0F3573; }
    .desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #4A5568; }
    .arrow { stroke: #90A4C8; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #90A4C8; }
    .badge { fill: #FFFFFF; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .end-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F3573; }
    .end-desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
    .danger-box { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1; }
    .danger-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #991B1B; }
    .warn-box { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1; }
    .warn-title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #92400E; }
</style>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowhead"/>
    </marker>
    
  </defs>
  <g transform="translate(100,15)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">1. Tiếp nhận kết quả thi</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Nhận kết quả chính thức từ ÖSD, kiểm tra tính đầy đủ và</text>
    <text class="desc" x="210" y="66" text-anchor="middle">chính xác.</text>
  </g>
  <path class="arrow" d="M310,91 L310,111" marker-end="url(#arrowV)"/>
  <g transform="translate(100,111)">
    <rect class="card" x="0" y="0" width="420" height="76" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="30" text-anchor="middle">2. Cập nhật và công bố kết quả</text>
    <text class="desc" x="210" y="50" text-anchor="middle">Cập nhật lên hệ thống, kiểm tra dữ liệu, công bố cho thí</text>
    <text class="desc" x="210" y="66" text-anchor="middle">sinh trên website.</text>
  </g>
  <text x="310" y="225" text-anchor="middle" class="warn-title" font-size="12.5">⚠ Nếu có phát sinh</text>
  <path class="arrow" d="M310,187 L200.0,233" marker-end="url(#arrowV)" stroke-dasharray="4,3"/>
  <g transform="translate(100.0,233)">
    <rect class="warn-box" x="0" y="0" width="200.0" height="100" rx="9" stroke-dasharray="4,3"/>
    <text class="warn-title" x="100.0" y="20" text-anchor="middle" font-size="12.5">Phúc khảo</text>
    <text class="desc" x="100.0" y="40" text-anchor="middle" font-size="11">Tiếp nhận yêu cầu trong</text>
    <text class="desc" x="100.0" y="54" text-anchor="middle" font-size="11">thời hạn, hướng dẫn thí</text>
    <text class="desc" x="100.0" y="68" text-anchor="middle" font-size="11">sinh hoàn thiện hồ sơ.</text>
  </g>
  <path class="arrow" d="M310,187 L420.0,233" marker-end="url(#arrowV)" stroke-dasharray="4,3"/>
  <g transform="translate(320.0,233)">
    <rect class="warn-box" x="0" y="0" width="200.0" height="100" rx="9" stroke-dasharray="4,3"/>
    <text class="warn-title" x="100.0" y="20" text-anchor="middle" font-size="12.5">Khiếu nại</text>
    <text class="desc" x="100.0" y="40" text-anchor="middle" font-size="11">Tiếp nhận phản ánh, xác</text>
    <text class="desc" x="100.0" y="54" text-anchor="middle" font-size="11">minh, phối hợp ÖSD xử lý</text>
    <text class="desc" x="100.0" y="68" text-anchor="middle" font-size="11">theo quy định.</text>
  </g>
  <path class="arrow" d="M200.0,333 L310,353" marker-end="url(#arrowV)" stroke-dasharray="4,3"/>
  <path class="arrow" d="M420.0,333 L310,353" marker-end="url(#arrowV)" stroke-dasharray="4,3"/>
  <g transform="translate(100,353)">
    <rect class="card" x="0" y="0" width="420" height="70" rx="10"/>
    <rect class="accent" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="26" text-anchor="middle" font-size="14">Hoàn tất</text>
    <text class="desc" x="210" y="43" text-anchor="middle" font-size="12">Lưu trữ hồ sơ phúc khảo/khiếu nại (nếu có), hoàn tất</text>
    <text class="desc" x="210" y="58" text-anchor="middle" font-size="12">công bố kết quả.</text>
  </g>
  <path class="arrow" d="M310,423 L310,443" marker-end="url(#arrowV)"/>
  <g transform="translate(100,443)">
    <rect class="card" x="0" y="0" width="420" height="70" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="420" height="5" rx="2"/>
    <text class="title" x="210" y="34" text-anchor="middle" font-size="15">✅ Sẵn sàng chuyển</text>
    <text class="desc" x="210" y="54" text-anchor="middle">sang Bước 11 — Cấp phát chứng chỉ</text>
  </g>
</svg>