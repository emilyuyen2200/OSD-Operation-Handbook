    <text class="desc" x="95.0" y="44" text-anchor="middle" font-size="11">Số lượng thí sinh, kết</text>
    <text class="desc" x="95.0" y="58" text-anchor="middle" font-size="11">quả, sự cố phát sinh.</text>
  </g>
