    <rect class="accent" x="0" y="0" width="190" height="5" rx="2"/>
    <text class="title" x="95.0" y="26" text-anchor="middle" font-size="13.5">3. Báo cáo &amp; họp tổng kết</text>
    <text class="desc" x="95.0" y="44" text-anchor="middle" font-size="11">Báo cáo Ban Lãnh đạo, họp</text>
    <text class="desc" x="95.0" y="58" text-anchor="middle" font-size="11">rút kinh nghiệm.</text>
  </g>
  <g transform="translate(98.1,516.3)">
    <rect class="card" x="0" y="0" width="190" height="92" rx="10"/>
    <rect class="accent" x="0" y="0" width="190" height="5" rx="2"/>
    <text class="title" x="95.0" y="26" text-anchor="middle" font-size="13.5">4. Đề xuất cải tiến</text>
    <text class="desc" x="95.0" y="44" text-anchor="middle" font-size="11">Tổng hợp, phân loại, xác</text>
    <text class="desc" x="95.0" y="58" text-anchor="middle" font-size="11">định tài liệu cần cập</text>
    <text class="desc" x="95.0" y="72" text-anchor="middle" font-size="11">nhật.</text>
  </g>
  <g transform="translate(7.2,236.7)">
