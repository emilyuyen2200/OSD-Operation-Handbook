    <rect class="accent" x="0" y="0" width="190" height="5" rx="2"/>
    <text class="title" x="95.0" y="26" text-anchor="middle" font-size="13.5">5. Cập nhật tài liệu</text>
    <text class="desc" x="95.0" y="44" text-anchor="middle" font-size="11">Handbook, Quy chế, Danh</text>
    <text class="desc" x="95.0" y="58" text-anchor="middle" font-size="11">mục rủi ro, Mẫu biểu &amp;</text>
    <text class="desc" x="95.0" y="72" text-anchor="middle" font-size="11">Checklist.</text>
