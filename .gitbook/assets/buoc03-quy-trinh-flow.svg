<svg viewBox="0 0 560 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card { fill: #F4F7FC; stroke: #E1E8F5; stroke-width: 1; }
      .accent { fill: #0F3573; }
      .accent-light { fill: #0059EC; }
      .title { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0F3573; }
      .desc { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4A5568; }
      .arrow { stroke: #90A4C8; stroke-width: 2.5; fill: none; }
      .arrowhead { fill: #90A4C8; }
    </style>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- 1 -->
  <g transform="translate(110,15)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">1. Xuất danh sách thí sinh</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Từ hệ thống, đối chiếu số lượng đăng ký</text>
  </g>
  <path class="arrow" d="M280,95 L280,125" marker-end="url(#arrowV)"/>

  <!-- 2 -->
  <g transform="translate(110,130)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">2. Sắp lịch thi Written</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Phân nhóm trình độ, phân phòng, chỗ ngồi</text>
  </g>
  <path class="arrow" d="M280,210 L280,240" marker-end="url(#arrowV)"/>

  <!-- 3 -->
  <g transform="translate(110,245)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">3. Sắp lịch thi Speaking</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Tạo slot, ghép cặp, bổ sung standby</text>
  </g>
  <path class="arrow" d="M280,325 L280,355" marker-end="url(#arrowV)"/>

  <!-- 4 -->
  <g transform="translate(110,360)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">4. Phân công nhân sự</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Giám thị theo tỷ lệ · Giám khảo · Điều phối</text>
  </g>
  <path class="arrow" d="M280,440 L280,470" marker-end="url(#arrowV)"/>

  <!-- 5 -->
  <g transform="translate(110,475)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">5. Kiểm tra lịch thi</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Không trùng lịch · không chồng chéo · đúng sức chứa</text>
  </g>
  <path class="arrow" d="M280,555 L280,585" marker-end="url(#arrowV)"/>

  <!-- 6 -->
  <g transform="translate(110,590)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">6. Trình phê duyệt</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Exam Director duyệt lịch thi cuối cùng</text>
  </g>
  <path class="arrow" d="M280,670 L280,700" marker-end="url(#arrowV)"/>

  <!-- 7 -->
  <g transform="translate(110,705)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">7. Phát hành lịch thi</text>
    <text class="desc" x="170" y="58" text-anchor="middle">Upload hệ thống · giấy báo dự thi tự động gửi</text>
  </g>
  <path class="arrow" d="M280,785 L280,815" marker-end="url(#arrowV)"/>

  <!-- 8 done -->
  <g transform="translate(110,820)">
    <rect class="card" x="0" y="0" width="340" height="80" rx="10"/>
    <rect class="accent-light" x="0" y="0" width="340" height="5" rx="2"/>
    <text class="title" x="170" y="36" text-anchor="middle">✅ Sẵn sàng chuyển</text>
    <text class="desc" x="170" y="58" text-anchor="middle">sang Bước 4 — Tiếp nhận đề thi</text>
  </g>
</svg>
